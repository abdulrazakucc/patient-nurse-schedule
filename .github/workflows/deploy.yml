name: Deploy to GitHub Pages

# A static site cannot check who is asking -- every file on GitHub Pages can be
# downloaded by anyone -- so what this publishes is one of two shapes:
#
#   * without the NEOSTAY_USERS_JSON secret: the landing page only, with no
#     sign-in form, application code or data;
#   * with it: the application, whose data is encrypted and opens only in the
#     browser of someone signing in with an account from that secret.
#
# To give someone access: `make user-add EMAIL=...` on your computer, set the
# repository secret NEOSTAY_USERS_JSON (Settings -> Secrets and variables ->
# Actions) to the output of `make user-export`, then re-run this workflow.
#
# GitHub Pages serves the gh-pages branch at:
#   https://abdulrazakucc.github.io/patient-nurse-schedule/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test
        run: python -m pytest

      - name: Build the site
        env:
          NEOSTAY_USERS_JSON: ${{ secrets.NEOSTAY_USERS_JSON }}
        run: python scripts/build_pages_site.py --out site

      # Defence in depth: fail rather than publish readable data.
      - name: Verify what is published
        run: |
          python - <<'PY'
          import json, pathlib, sys
          site = pathlib.Path("site")
          files = sorted(str(p.relative_to(site)) for p in site.rglob("*") if p.is_file())
          if any(name.startswith("data/") for name in files):
              sys.exit("Readable data bundles must never be published")
          if not (site / "data.sealed").exists():
              landing = {".nojekyll", "index.html", "styles.css", "favicon.svg",
                         "access.js", "sealed.js", "access-config.js"}
              if set(files) != landing:
                  sys.exit(f"Unexpected files: {files}")
              if 'mode: "closed"' not in (site / "access-config.js").read_text():
                  sys.exit("The landing page is not in closed mode")
              print("Verified: landing page only. Set NEOSTAY_USERS_JSON to publish the application.")
              sys.exit(0)
          if not (site / "data.sealed").read_bytes().startswith(b"NEOS1"):
              sys.exit("The data is not sealed")
          if 'mode: "sealed"' not in (site / "access-config.js").read_text():
              sys.exit("The published pages are not in sealed mode")
          keys = json.loads((site / "keys.json").read_text())
          fields = {"id", "salt", "iterations", "nonce", "wrapped"}
          if not keys["users"] or any(set(entry) != fields for entry in keys["users"]):
              sys.exit("Unexpected account entries in keys.json")
          print(f"Verified: application sealed for {len(keys['users'])} account(s)")
          PY

      - name: Publish site/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"
