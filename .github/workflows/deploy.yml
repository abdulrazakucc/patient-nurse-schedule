name: Deploy to GitHub Pages

# Publishes frontend/ to the gh-pages branch on every push to main.
# GitHub Pages serves the site from that branch at:
#   https://abdulrazakucc.github.io/patient-nurse-schedule/

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify data bundles are present
        run: |
          python3 scripts/build_frontend_data.py || true
          test -f frontend/data/neostay-data.js

      - name: Publish frontend/ to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./frontend
          enable_jekyll: false
          commit_message: "Deploy ${{ github.sha }}"
