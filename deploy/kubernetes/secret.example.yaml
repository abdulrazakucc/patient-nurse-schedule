# EXAMPLE ONLY — never commit a real Secret.
#
# Create the real one from your own files, on the machine that holds the accounts:
#
#   make user-add EMAIL=someone@hospital.org NAME="Full Name"
#   make -s user-export > /tmp/users.json
#   kubectl create secret generic neostay \
#     --from-file=users.json=/tmp/users.json \
#     --from-literal=session-secret="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
#   rm /tmp/users.json
#
# users.json holds PBKDF2 password hashes: treat it as a password database.
# Changing accounts means updating this Secret and restarting the deployment:
#
#   kubectl rollout restart deployment/neostay
apiVersion: v1
kind: Secret
metadata:
  name: neostay
type: Opaque
stringData:
  users.json: |
    {
      "format": "neostay-users",
      "version": 1,
      "kdf": "pbkdf2-sha256",
      "users": []
    }
  session-secret: "replace-with-at-least-32-random-characters"
