<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Analytics · NeoStay</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <script src="components.js" defer></script>
</head>
<body data-page="analytics">
  <main>
    <section class="panel">
      <div class="panel-head">
        <h3>Population Analytics</h3>
        <p>A decade of VLBW outcomes across the center</p>
      </div>
      <div class="chart-grid">
        <div class="card chart-card">
          <h4>Length of stay by birth weight</h4>
          <canvas id="chartLosWeight"></canvas>
        </div>
        <div class="card chart-card">
          <h4>Length of stay by gestational age</h4>
          <canvas id="chartLosGa"></canvas>
        </div>
        <div class="card chart-card wide">
          <h4>Disposition mix by birth weight</h4>
          <canvas id="chartDisposition"></canvas>
        </div>
      </div>
    </section>
  </main>
  <script src="analytics.js" defer></script>
</body>
</html>
